server.port=8080
spring.application.name=water-testing-laboratory

# MongoDB Configuration
# Supports local MongoDB or automatically starts in-memory MongoDB Server if local instance is not running
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/water_testing_lab}
spring.data.mongodb.auto-index-creation=true

# Security & JWT (Secret must be at least 256 bits)
jwt.secret=${JWT_SECRET:AquaPureLaboratorySuperSecretKeyForJWTAuth2026Minimum256BitsLongAndSecureKey}
jwt.expiration=604800000

# File Upload / Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Seeding demo data on start
app.seed-demo-data=true

# Logging
logging.level.com.wtlms=INFO
logging.level.org.springframework.security=WARN
